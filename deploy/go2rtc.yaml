# go2rtc — restreamer RTSP -> browser.
# Browser tidak bisa membaca RTSP langsung, jadi lapisan ini wajib ada.
#
# Pasang (Linux):
#   wget https://github.com/AlexxIT/go2rtc/releases/latest/download/go2rtc_linux_amd64
#   chmod +x go2rtc_linux_amd64 && sudo mv go2rtc_linux_amd64 /usr/local/bin/go2rtc
#   go2rtc -config /opt/cctvdashboard/deploy/go2rtc.yaml
#
# PENTING: nama stream HARUS SAMA PERSIS dengan line_id di dashboard —
# ajl-01 sampai ajl-18 — karena URL dibangun dari id itu
# (CCTV_STREAM_URL="http://IP:1984/api/stream.mp4?src={id}").
# Satu nama yang meleset = satu kotak kamera hitam, tanpa pesan kesalahan.
#
# Line dinomori BERURUTAN menyeberangi hall, mengikuti LAYOUT di
# app/source.py:  Hall A = ajl-01..06,  Hall B = ajl-07..15,
# Hall C = ajl-16..18.  Kalau urutan hall di pabrik berbeda, ubah di
# app/source.py DULU, baru samakan berkas ini.
#
# TODO(pabrik): ganti IP, user, dan password dengan kamera sebenarnya.
# BERKAS INI BERISI PASSWORD KAMERA. Salin jadi go2rtc.local.yaml untuk
# dipakai sehari-hari — nama itu sudah masuk .gitignore. Yang di repo ini
# hanya contoh.

api:
  listen: ":1984"

rtsp:
  listen: ":8554"      # dipakai AI worker untuk menarik stream

streams:
  # Tiap line butuh DUA entri:
  #   <line_id>       main stream, dipakai halaman detail & baca lampu
  #   <line_id>-sub   sub stream, dipakai GRID
  #
  # Grid 18 kamera WAJIB pakai sub-stream (CCTV_STREAM_URL_GRID), atau PC
  # operator tersendat mendekode 18 aliran resolusi penuh sekaligus.
  #
  # Channel 101 = main, 102 = sub pada kamera Hikvision/Dahua.
  # Merek lain memakai jalur berbeda — cek di manual kameranya.

  # ---------------- Hall A : ajl-01 .. ajl-06 ----------------
  ajl-01:
    - rtsp://admin:password@192.168.1.11:554/Streaming/Channels/101
  ajl-01-sub:
    - rtsp://admin:password@192.168.1.11:554/Streaming/Channels/102

  ajl-02:
