# Reverse proxy opsional — supaya dashboard diakses di port 80 tanpa nomor port.
# Pasang: /etc/nginx/conf.d/cctv.conf lalu `sudo nginx -t && sudo systemctl reload nginx`

server {
    listen 80;
    server_name cctv.pabrik.local;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # WAJIB untuk WebSocket (/ws)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
